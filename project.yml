name: ScreenshotOrganizer
options:
  bundleIdPrefix: com.lrendina
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ScreenshotOrganizer:
    type: application
    platform: iOS
    sources: [ScreenshotOrganizer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lrendina.ScreenshotOrganizer
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Shotsort
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${SHOTSORT_TEAM_ID}
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Shotsort reads your screenshots to sort them into categories.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Shotsort can save each category as an album in Photos.
  ScreenshotOrganizerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ScreenshotOrganizerTests]
    dependencies:
      - target: ScreenshotOrganizer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lrendina.ScreenshotOrganizerTests
schemes:
  ScreenshotOrganizer:
    build:
      targets:
        ScreenshotOrganizer: all
        ScreenshotOrganizerTests: [test]
    test:
      targets: [ScreenshotOrganizerTests]
